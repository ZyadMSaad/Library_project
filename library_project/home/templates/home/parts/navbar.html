{% load static %}
<div id="navbar">

  <a href="/">Home</a>
  <a href="{% url 'products2' %}">Categories</a>

  {% if not user.is_authenticated %}

    <a href="/signup/">Sign Up</a>
    <a href="/login/">Login</a>

  {% else %}

    {% if user.profile.is_admin %}

      <a href="{% url 'Books' %}">Available books</a>
      <a href="{% url 'add_product' %}">Add new books</a>
      <a href="{% url 'delete_product' %}">Delete books</a>
      <a href="{% url 'products2' %}">Edit books</a>

    {% else %}

      <a href="{% url 'SearchForBooks' %}">Search</a>
      <a href="{% url 'displayBooks' %}">Borrowed books</a>

    {% endif %}

    <form action="/logout/" method="POST" style="display:inline; margin:0; padding:0;">
      {% csrf_token %}
      <button type="submit" id="logoutBtn">Logout</button>
    </form>

  {% endif %}

</div>
