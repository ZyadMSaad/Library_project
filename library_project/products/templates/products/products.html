{% extends 'base.html' %}

{% block content %}
<div style="background-color: #f7f0e4; min-height: 100vh; padding: 50px 10% ; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <h1 style="color: #c48d5f; text-align: center; margin-bottom: 80px; text-transform: uppercase; font-size: 2.2rem; font-weight: bold;">
        ALL NEW BOOKS
    </h1>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 50px 30px;">
          {% if not x.borrowed %}
        {% for x in pro %}
        <div style="text-align: left;">
            <h3 style="font-weight: 900; font-size: 1.1rem; margin-bottom: 10px; color: #000; white-space: nowrap;">
                Book'Name :{{ x.name }}
            </h3>
            
            <p style="margin: 5px 0; font-size: 0.95rem; color: #333;">
                Category: {{ x.category }}
            </p>
            
            <p style="margin: 5px 0; font-size: 0.95rem; color: #333;">
                Author: {{ x.author }}
            </p>
        </div>
        {% endfor %}
        {% endif %}
    </div>
</div>
{% endblock content %}
