{% load static %}
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Delete Book</title>
    <link rel="stylesheet" href="{% static 'CSS/nav.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/delete.css' %}"> 
</head>
<body>

    <!-- Navbar -->
    {% include 'home/parts/navbar.html' %}

    <!-- Delete Form -->
    <div id="deleteForm">
        <h2>Delete Book</h2>
        <form method="POST" action="{% url 'delete_product' %}">
            {% csrf_token %}
            <label for="bookID">Enter Book ID:</label>
            <input type="number" id="bookID" name="book_id" required>
            <input type="submit" value="Delete Book">
        </form>
    </div>

    <script src="{% static 'js/delete.js' %}"></script>
</body>
</html>
